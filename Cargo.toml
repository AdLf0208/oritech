[package]
# Port of Oritech 1.2.13 (Rearth/Oritech, CC0-1.0) to Horizon 26.3 at the SDK build
# horizon-mod.toml pins. Clean-room Rust rewrite from the mod's behaviour
# (FINDINGS.md); local-only until the maintainer approves publishing, publishable
# under CC0 with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "oritech"
version = "0.2.7"
edition = "2024"
license = "CC0-1.0"
description = "Oritech for Horizon, slices 1 to 5: the Basic Generator, the Pulverizer, the Powered Furnace, the Industrial Chiller, the Lava Generator and the machine addon system"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# The carried, byte-identical rules module parses the `oritech:pulverizer` recipe JSON, so this
# package's one registry dependency is serde_json; the resolved Cargo.lock therefore travels
# inside the package (see notes.md, the migration's trap 1).
serde_json = "1"
