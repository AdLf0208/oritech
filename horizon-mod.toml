# The only manifest and the only identity of this mod (mod API 0.2, SDK layout).
# Cargo's package name and version are not the mod's.
id = "oritech"
name = "Oritech"
version = "0.2.9"
description = """A port of Oritech 1.2.13 for Horizon, slices 1 to 7: the Basic Generator, the Pulverizer, the Powered
Furnace multiblock, the Industrial Chiller, the Lava Generator, the machine addon system, the Control
Unit Addon and the material and component chain. The generator burns any fuel the game's fuel table knows for 32 FE a tick into a 50,000 FE
buffer that accepts no inserts and gives 256 FE a call; the pulverizer spends 32 FE a tick and turns one
input into its recipe's results in the recipe's time, reading the jar's own `oritech:pulverizer` files;
the powered furnace is a controller plus one of the seven machine cores above it that smelts any vanilla
smelting recipe at twice a vanilla furnace's speed for 32 FE a tick; the chiller is the mod's first fluid
machine — a controller plus a core to its north, one four-bucket tank, that freezes a bucket of water
into three ice or a bucket of lava into two obsidian in 200 ticks for 6,400 FE, from the jar's own
`oritech:cooler` recipes; the lava generator burns 100 mB of lava in 120 ticks for exactly 7,680 FE,
pushes it to its ten targets, and is a controller plus a core above it. The six default addon blocks —
speed, efficiency, Synergy Matrix, Auxiliary Processing Chamber, capacitor and burst — sit in each
machine's own addon slots and are scanned every tick: they multiply its speed and energy use (additively,
the jar's shipped default), add chambers, capacity and insert rate, or charge a burst that runs a machine
eight times as fast. The seventh addon, the Control Unit Addon, gates its machine: a redstone signal at
the addon holds the whole tick (no recipe, no progress, no FE) until the signal goes.
Every buffer is a real block energy capability another mod's cable can read, every tank a real block
fluid handler another mod's pipe can fill, and a fuelled generator pushes its FE to the machines beside
it. Not yet ported: the GUI, GeckoLib models, the energy network, the ore-processing chain, the special
addons (the control unit's four comparator modes, fluid, proxy, extender), the other multiblock
machines, and the ores themselves — the ingots' worldgen cannot generate at this nightly, so the chain
is craftable from the components down and the ore is the next slice."""
authors = ["Rearth", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside
# the carried assets/ and data/. The id is the resource namespace and the only identity.
api = "0.2"
# "both" is the installation side: the machines run on the server, and single player's integrated
# server belongs to the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this mod declares twenty-two blocks and their block entities, so it is used, not just
# required.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
