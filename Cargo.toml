[package]
# Port of Oritech 1.2.13 (Rearth/Oritech, CC0-1.0) to Horizon 26.3 at the SDK build
# horizon-mod.toml pins. Clean-room Rust rewrite from the mod's behaviour
# (FINDINGS.md); local-only until the maintainer approves publishing, publishable
# under CC0 with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "oritech"
version = "0.2.15"
edition = "2024"
license = "CC0-1.0"
description = "Oritech for Horizon, slices 1 to 11: the Basic Generator, the Pulverizer, the Powered Furnace, the Industrial Chiller, the Lava Generator, the machine addon system, the Control Unit Addon, the material and component chain, the Assembler, the Centrifuge, the Foundry and the Fragment Forge"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). This is the **only** dependency: the
# registry refuses a registry crate (R9), so the recipe JSON is read by this package's own
# `src/json.rs` and no `Cargo.lock` travels in the archive.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
